<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dubai & Abu Dhabi Real Estate — Daily Feed</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RE Feed">
</head>
<body>
<header>
  <div class="header-row">
    <h1>Dubai &amp; Abu Dhabi Real Estate</h1>
    <div class="header-btns">
      <button id="btn-produced" class="icon-btn" type="button" title="Produced archive">🎥</button>
      <button id="btn-settings" class="icon-btn" type="button" title="Settings / API key">⚙️</button>
      <button id="refresh" class="refresh-btn" type="button">🔄 Refresh</button>
    </div>
  </div>
  <div class="updated" id="updated">Loading...</div>
  <div class="view-tabs">
    <button id="btn-created" class="view-btn" type="button">✅ Created (0)</button>
    <button id="btn-want" class="view-btn" type="button">⭐ To create (0)</button>
    <button id="btn-scripts" class="view-btn" type="button">📚 All scripts</button>
  </div>
  <input type="text" class="search" id="search" placeholder="Search headlines, developers, areas...">
  <div class="filters">
    <span class="pill active" data-cat="all">All</span>
    <span class="pill" data-cat="developer_launch">Developer Launches</span>
    <span class="pill" data-cat="infrastructure">Infrastructure</span>
    <span class="pill" data-cat="market_data">Market Data</span>
    <span class="pill" data-cat="abu_dhabi">Abu Dhabi</span>
    <span class="pill" data-cat="market_drivers">Market Drivers</span>
  </div>
</header>
<main>
  <div class="top-picks" id="top-picks" style="display:none"></div>
  <div id="feed" class="status">Loading feed...</div>
</main>

<div id="detail-overlay" class="detail-overlay" style="display:none">
  <div class="detail-panel">
    <button id="detail-close" class="detail-close" type="button" aria-label="Close">✕</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="studio-overlay" class="detail-overlay" style="display:none">
  <div class="detail-panel studio-panel">
    <button id="studio-close" class="detail-close" type="button" aria-label="Close">✕</button>
    <div id="studio-content"></div>
  </div>
</div>

<div id="settings-overlay" class="detail-overlay" style="display:none">
  <div class="detail-panel settings-panel">
    <button id="settings-close" class="detail-close" type="button" aria-label="Close">✕</button>
    <div id="settings-content"></div>
  </div>
</div>

<div id="archive-overlay" class="detail-overlay" style="display:none">
  <div class="detail-panel studio-panel">
    <button id="archive-close" class="detail-close" type="button" aria-label="Close">✕</button>
    <div id="archive-content"></div>
  </div>
</div>

<script src="app.js?v=9"></script>
<script src="studio.js?v=2"></script>
</body>
</html>
