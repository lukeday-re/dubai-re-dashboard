<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dubai & Abu Dhabi Real Estate — Daily Feed</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1216">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RE Feed">
</head>
<body>
<header>
  <div class="header-row">
    <h1>Dubai &amp; Abu Dhabi Real Estate</h1>
    <button id="refresh" class="refresh-btn" type="button">🔄 Refresh</button>
  </div>
  <div class="updated" id="updated">Loading...</div>
  <input type="text" class="search" id="search" placeholder="Search headlines, developers, areas...">
  <div class="filters">
    <span class="pill active" data-cat="all">All</span>
    <span class="pill" data-cat="developer_launch">Developer Launches</span>
    <span class="pill" data-cat="infrastructure">Infrastructure</span>
    <span class="pill" data-cat="market_data">Market Data</span>
    <span class="pill" data-cat="abu_dhabi">Abu Dhabi</span>
    <span class="pill" data-cat="market_drivers">Market Drivers</span>
  </div>
</header>
<main>
  <div class="top-picks" id="top-picks" style="display:none"></div>
  <div id="feed" class="status">Loading feed...</div>
</main>

<script src="app.js?v=5"></script>
</body>
</html>
